<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serenity Spa - Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #075E54;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .chat-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #efeae2;
      position: relative;
    }
    .chat-header {
      background: #075E54;
      color: white;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .chat-header .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #128C7E;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .chat-header .info h2 { font-size: 16px; font-weight: 600; }
    .chat-header .info p { font-size: 12px; opacity: 0.8; }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .message {
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      position: relative;
    }
    .message.user {
      background: #dcf8c6;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .message.bot {
      background: white;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 1px rgba(0,0,0,0.05);
    }
    .message .time {
      font-size: 10px;
      color: #999;
      text-align: right;
      margin-top: 4px;
    }
    .typing {
      align-self: flex-start;
      background: white;
      padding: 12px 16px;
      border-radius: 8px;
      display: none;
      box-shadow: 0 1px 1px rgba(0,0,0,0.05);
    }
    .typing span {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #999;
      border-radius: 50%;
      margin: 0 2px;
      animation: bounce 1.4s ease-in-out infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
    .input-area {
      background: #f0f0f0;
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .input-area input {
      flex: 1;
      padding: 10px 14px;
      border: none;
      border-radius: 24px;
      font-size: 14px;
      outline: none;
    }
    .input-area button {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: #128C7E;
      color: white;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .input-area button:hover { background: #075E54; }
    .input-area button:disabled { background: #ccc; cursor: not-allowed; }
    .welcome-banner {
      background: #fff3cd;
      color: #856404;
      padding: 10px 16px;
      font-size: 12px;
      text-align: center;
      border-bottom: 1px solid #ffeeba;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <div class="avatar">🧖‍♀️</div>
      <div class="info">
        <h2>Serenity Spa</h2>
        <p>En línea</p>
      </div>
    </div>
    <div class="welcome-banner">
      Demo · Los datos del catálogo son placeholder
    </div>
    <div class="messages" id="messages">
      <div class="message bot">
        ¡Hola! Soy SpaBot, el asistente virtual de Serenity Spa & Wellness 🧖‍♀️✨
        <div class="time">12:00</div>
      </div>
      <div class="message bot">
        ¿En qué puedo ayudarte? Puedes preguntarme por nuestros servicios, precios o agendar una cita.
        <div class="time">12:00</div>
      </div>
    </div>
    <div class="typing" id="typing">
      <span></span><span></span><span></span>
    </div>
    <div class="input-area">
      <input type="text" id="input" placeholder="Escribe un mensaje..." autofocus>
      <button id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
  </div>
  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const typingEl = document.getElementById('typing');
    const sessionId = getSessionId();

    function getSessionId() {
      let id = localStorage.getItem('demoSessionId');
      if (!id) {
        id = Math.random().toString(36).slice(2) + Date.now().toString(36);
        localStorage.setItem('demoSessionId', id);
      }
      return id;
    }

    inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

    function addMessage(text, role) {
      const div = document.createElement('div');
      div.className = 'message ' + role;
      const now = new Date();
      const time = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
      div.innerHTML = text.replace(/\n/g, '<br>') + '<div class="time">' + time + '</div>';
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      inputEl.value = '';
      addMessage(text, 'user');
      sendBtn.disabled = true;
      typingEl.style.display = 'block';
      messagesEl.scrollTop = messagesEl.scrollHeight;

      try {
        const res = await fetch('/demo/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, sessionId }),
        });
        const data = await res.json();
        typingEl.style.display = 'none';
        if (data.reply) {
          addMessage(data.reply, 'bot');
        } else {
          addMessage('Error: no se recibió respuesta', 'bot');
        }
      } catch (err) {
        typingEl.style.display = 'none';
        addMessage('Error de conexión con el servidor', 'bot');
      }
      sendBtn.disabled = false;
      inputEl.focus();
    }
  </script>
</body>
</html>
